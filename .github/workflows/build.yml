name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project (zip stays zipped in the repo)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "No .zip found in the repo root"; exit 1; fi
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle not found inside the zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build release APKs
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
